name: black

on:
  push:
    branches: [main]
  pull_request:

jobs:
  black:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: psf/black@stable
        with:
          options: "--check --diff"
          src: "erigon_proxy"
          version: "~= 25.1"
